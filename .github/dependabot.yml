version: 2
updates:
  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/Desarrollo/Uywa/Codigo/Frontend/react-uywa"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      mui:
        patterns:
          - "@mui/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "@testing-library/*"
          - "jest*"
        update-types:
          - "minor"
          - "patch"
      babel:
        patterns:
          - "@babel/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates that could break compatibility
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-scripts"
        update-types: ["version-update:semver-major"]

  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/Desarrollo/Uywa/Codigo/Backend/uywa-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - "minor"
          - "patch"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "jest*"
          - "@types/jest"
          - "ts-jest"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates that could break compatibility
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
