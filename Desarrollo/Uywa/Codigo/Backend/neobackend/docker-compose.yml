version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: wasa
      POSTGRES_PASSWORD: wasa
      POSTGRES_DB: uywa
    ports:
      - '5499:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    # Agregar healthcheck para asegurar que la DB esté lista
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wasa -d uywa']
      interval: 5s
      timeout: 5s
      retries: 5

  # nuevo servicio para el backend Nest
  nest-backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - '3000:3000'
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    restart: always
volumes:
  db_data:
